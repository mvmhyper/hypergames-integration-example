openapi: 3.0.3
info:
  title: Hyper Games Integration Example
  version: 1.0.0
servers:
  - url: https://hypergames-integration-example.dev.mvm-tech.xyz
paths:
  /health:
    get:
      summary: Liveness check
      responses:
        '200':
          description: Up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  uptime:
                    type: number
  /api:
    get:
      summary: Service status
      responses:
        '200':
          description: Up
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /api/users:
    post:
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/games:
    get:
      summary: List games
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'
    post:
      summary: Create game
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name, time_limit, url]
              properties:
                slug:
                  type: string
                name:
                  type: string
                time_limit:
                  type: integer
                url:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/tournaments:
    post:
      summary: Start tournament
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, game_slug, type, participant_limit]
              properties:
                name:
                  type: string
                game_slug:
                  type: string
                type:
                  type: string
                  enum: [PVP, MULTI]
                participant_limit:
                  type: integer
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tournament'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/tournaments:
    get:
      summary: List tournaments
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTournaments'
  /api/tournaments/{id}/play:
    post:
      summary: Enter tournament
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayResult'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/tournaments/{id}:
    get:
      summary: Get tournament with game and entries
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentDetail'
        '404':
          $ref: '#/components/responses/Error'
  /api/entries/score:
    post:
      summary: Submit entry score
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreSubmission'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '401':
          $ref: '#/components/responses/Error'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
    Game:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        time_limit:
          type: integer
        url:
          type: string
    Tournament:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        game:
          type: object
          properties:
            slug:
              type: string
            name:
              type: string
            time_limit:
              type: integer
        type:
          type: string
          enum: [PVP, MULTI]
        participant_limit:
          type: integer
    TournamentDetail:
      allOf:
        - $ref: '#/components/schemas/Tournament'
        - type: object
          properties:
            entries:
              type: array
              items:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      username:
                        type: string
                  score:
                    type: number
                  time:
                    type: number
                  position:
                    type: integer
    Entry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tournament:
          $ref: '#/components/schemas/Tournament'
        user:
          $ref: '#/components/schemas/User'
        score:
          type: number
        time:
          type: number
        level:
          type: number
    PaginatedTournaments:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Tournament'
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
    PlayResult:
      type: object
      properties:
        playUrl:
          type: string
    ScoreSubmission:
      type: object
      required: [entryId, score]
      properties:
        entryId:
          type: string
          format: uuid
        tournamentId:
          type: string
          format: uuid
        gameId:
          type: string
          format: uuid
        score:
          type: number
        time:
          type: number
        level:
          type: number
        pvp:
          type: boolean
        isValid:
          type: boolean
