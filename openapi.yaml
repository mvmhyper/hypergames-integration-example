openapi: 3.0.3
info:
  title: test-api
  version: 1.0.0
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Liveness check
      responses:
        '200':
          description: Up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  uptime:
                    type: number
  /api:
    get:
      summary: Service status
      responses:
        '200':
          description: Up
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /api/users:
    post:
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/games:
    post:
      summary: Create game
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name, time_limit, url]
              properties:
                slug:
                  type: string
                name:
                  type: string
                time_limit:
                  type: integer
                url:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/tournaments:
    post:
      summary: Start tournament
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, game_slug, type, participant_limit]
              properties:
                name:
                  type: string
                game_slug:
                  type: string
                type:
                  type: string
                  enum: [PVP, MULTI]
                participant_limit:
                  type: integer
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tournament'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /api/tournaments/{id}/play:
    post:
      summary: Enter tournament
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayResult'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/tournaments/{id}:
    get:
      summary: Get tournament with game and entries
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentDetail'
        '404':
          $ref: '#/components/responses/Error'
  /api/entries:
    post:
      summary: Create entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tournament_id, user_id]
              properties:
                tournament_id:
                  type: string
                  format: uuid
                user_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/entries/score:
    post:
      summary: Submit entry score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreSubmission'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
    Game:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        time_limit:
          type: integer
        url:
          type: string
    Tournament:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        game:
          $ref: '#/components/schemas/Game'
        type:
          type: string
          enum: [PVP, MULTI]
        participant_limit:
          type: integer
    TournamentDetail:
      allOf:
        - $ref: '#/components/schemas/Tournament'
        - type: object
          properties:
            entries:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  score:
                    type: number
                  user:
                    $ref: '#/components/schemas/User'
    Entry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tournament:
          $ref: '#/components/schemas/Tournament'
        user:
          $ref: '#/components/schemas/User'
        score:
          type: number
        time:
          type: number
        level:
          type: number
    PlayResult:
      type: object
      properties:
        entry:
          $ref: '#/components/schemas/Entry'
        playUrl:
          type: string
    ScoreSubmission:
      type: object
      required: [entryId, score]
      properties:
        entryId:
          type: string
          format: uuid
        tournamentId:
          type: string
          format: uuid
        gameId:
          type: string
          format: uuid
        score:
          type: number
        time:
          type: number
        level:
          type: number
        pvp:
          type: boolean
        isValid:
          type: boolean
